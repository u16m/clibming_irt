[project]
name = "clibming-irt"
version = "0.1.0"
description = "Climbing IRT experiment"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "torch>=2.2",
  "kagglehub",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["climbing_irt", "ifsc_irt_experiment"]
