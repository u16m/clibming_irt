[project]
name = "clibming-irt"
version = "0.1.0"
description = "Climbing IRT experiment"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.17.0",
  "pandas==0.25.0",
  "python-dateutil==2.8.0",
  "pytz==2019.2",
  "scipy==1.3.0",
  "six==1.12.0",
  "kagglehub",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
